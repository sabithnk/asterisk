[global]
type=global
user_agent=Docker-Asterisk
default_realm=139.59.3.54
external_signaling_address=139.59.3.54
external_media_address=139.59.3.54


; ---------- Transport ----------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
external_signaling_address=139.59.3.54
external_media_address=139.59.3.54

; ---------- MicroSIP Extension ----------
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001-identify]
type=identify
endpoint=1001
match=202.88.254.119/32




; ---------- Plivo Outbound Trunk ----------
[plivo-trunk]
type=endpoint
transport=transport-udp
context=from-plivo
disallow=all
allow=ulaw,alaw
outbound_auth=plivo-auth
aors=plivo-aor
direct_media=no
from_domain=85062120002083746.zt.plivo.com

[plivo-aor]
type=aor
contact=sip:85062120002083746.zt.plivo.com:5060

[plivo-auth]
type=auth
auth_type=ip
